[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-preflight"
version = "0.2.0"
description = "Pre-flight gate for KiCad boards drafted with AI help: refuses a board that is not ready to order."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Bennett Dixon"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.scripts]
preflight = "pcb_preflight.cli:main"

[tool.setuptools]
packages = ["pcb_preflight"]
